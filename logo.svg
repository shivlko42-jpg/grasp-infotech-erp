<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D5EF0"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="white" opacity="0.04"/>

  <!-- monogram -->
  <text x="256" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="220" fill="#FFFFFF" text-anchor="middle">GI</text>

  <!-- growth bars accent -->
  <g>
    <rect x="352" y="352" width="26" height="46" rx="6" fill="url(#bar)"/>
    <rect x="386" y="330" width="26" height="68" rx="6" fill="url(#bar)"/>
    <rect x="420" y="304" width="26" height="94" rx="6" fill="url(#bar)"/>
  </g>

  <!-- underline accent -->
  <rect x="96" y="356" width="150" height="10" rx="5" fill="#FBBF24" opacity="0.9"/>
</svg>
